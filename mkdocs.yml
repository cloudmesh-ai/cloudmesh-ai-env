site_name: cloudmesh-ai-env
site_url: https://cloudmesh-ai.github.io/cloudmesh-ai-env
site_description: Environment configuration for Cloudmesh AI.
repo_url: https://github.com/cloudmesh-ai/cloudmesh-ai-env
repo_name: cloudmesh-ai-env

docs_dir: docs
use_directory_urls: false

extra_css:
  - css/custom.css

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Home: index.md
  - User Manual: user_manual.md

plugins:
  - cloudmesh-ai-theme
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_section_style: table
            docstring_style: google
            group_by_category: true
            members: true
            separate_signature: true
            show_category_heading: true
            show_root_full_path: true
            show_source: true
            show_submodules: true
          paths:
            - src

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
      line_spans: __span
      pygments_style: colorful
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed
  - admonition
  - pymdownx.details
